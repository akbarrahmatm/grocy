name: grocy-be

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: grocy-be-app:latest
        restart: unless-stopped
        env_file:
            - .env
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '.:/var/www/html:cached'
            - '/var/www/html/vendor'
            - 'storage_volume:/var/www/html/storage'

    queue:
        image: grocy-be-app:latest
        restart: unless-stopped
        command: php artisan queue:work --tries=3 --timeout=120 --sleep=3
        env_file:
            - .env
        depends_on:
            - app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '.:/var/www/html:cached'
            - '/var/www/html/vendor'
            - 'storage_volume:/var/www/html/storage'

    nginx-api:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - '127.0.0.1:8002:80'
        volumes:
            - '.:/var/www/html:ro'
            - 'storage_volume:/var/www/html/storage:ro'
            - './docker/nginx/grocy-api.conf:/etc/nginx/conf.d/default.conf:ro'
        depends_on:
            - app

volumes:
    storage_volume:
        driver: local
